[project]
name = "nekt-meltano-tap-facebook"
version = "0.0.0"
description = "`tap-facebook` is a Singer tap for facebook, built with the Meltano SDK for Singer Taps."
readme = "README.md"
authors = [{ name = "Meltano", email = "hello@meltano.com" }]
license = "Elastic-2.0"
keywords = [
    "ELT",
    "facebook",
]
requires-python = ">=3.11"
dependencies = [
    # Pinned to one major. The requested field set is pinned separately by
    # INSIGHTS_FIELDS in tap_facebook/streams/ad_insights.py, so a bump no
    # longer rewrites the output schema on its own -- but the major still
    # tracks the Graph API version the SDK targets, so moving it is a
    # deliberate, tested step rather than something a lock refresh does for us.
    "facebook-business>=25.0.0,<26.0.0",
    "nekt-singer-sdk @ git+https://github.com/nektcom/singer-sdk.git@v0.25.1",
    "pendulum>=3.1.0,<4.0.0",
    "requests~=2.31.0",
]

[project.optional-dependencies]
s3 = [
    "fs-s3fs",
]

[project.scripts]
tap-facebook = 'tap_facebook.tap:TapFacebook.cli'

[dependency-groups]
dev = [
    "pytest>=7.4.1",
]

[tool.hatch.build.targets.wheel]
packages = [
    "tap_facebook",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = '--durations=10'

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
plugins = "sqlmypy"

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
ignore = [
    "COM812",  # missing-trailing-comma
    "ISC001",  # single-line-implicit-string-concatenation
]
select = ["ALL"]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.pydocstyle]
convention = "google"


[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"
